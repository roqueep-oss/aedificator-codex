name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Import code signing certificate (Windows)
        if: runner.os == 'Windows' && env.WIN_CSC_LINK != ''
        shell: powershell
        run: |
          $pfxPath = "${{ runner.temp }}\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          echo "CSC_LINK=$pfxPath" >> $env:GITHUB_ENV
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      # Releases de produção só podem ser publicados ASSINADOS: instalador
      # Windows não assinado é bloqueado pelo SmartScreen e o auto-update
      # depende de builds íntegros. Configure os secrets antes de criar a tag.
      - name: Require Windows code signing (release)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::error::Release Windows exige assinatura de código. Configure os secrets WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD (instalador não assinado será bloqueado pelo SmartScreen e o auto-update falhará)."
            exit 1
          fi
          echo "Instalador Windows será assinado."
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Require macOS code signing (release)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "::error::Release macOS exige assinatura. Configure os secrets MAC_CSC_LINK e MAC_CSC_KEY_PASSWORD."
            exit 1
          fi
          echo "App macOS será assinado."
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then npm run build:win; fi
          if [ "$RUNNER_OS" = "macOS" ]; then npm run build:mac; fi
          if [ "$RUNNER_OS" = "Linux" ]; then npm run build:linux; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      # Smoke test REAL do executável empacotado: valida boot do backend e
      # gravação de config no userData (regressão do bug de escrita no asar).
      - name: Smoke test executável empacotado (Windows)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 6
        run: |
          set +e
          "./dist/win-unpacked/Aedificator Codex IDE.exe"
          code=$?
          set -e
          echo "Smoke exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::Smoke test do executável falhou (exit $code). Verifique logs acima."
            exit 1
          fi
          echo "✅ Smoke test do executável OK"
        env:
          AED_SMOKE_TEST: "1"
          AED_USER_DATA: ${{ runner.temp }}/aedificator-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
