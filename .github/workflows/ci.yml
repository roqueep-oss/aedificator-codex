name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Import code signing certificate (Windows)
        if: runner.os == 'Windows' && env.WIN_CSC_LINK != ''
        shell: powershell
        run: |
          $pfxPath = "${{ runner.temp }}\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          echo "CSC_LINK=$pfxPath" >> $env:GITHUB_ENV
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Check Windows code signing
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::warning::Instalador Windows NÃO será assinado. Configure os secrets WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD (SmartScreen bloqueará o instalador)."
          else
            echo "Instalador Windows será assinado."
          fi
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then npm run build:win; fi
          if [ "$RUNNER_OS" = "macOS" ]; then npm run build:mac; fi
          if [ "$RUNNER_OS" = "Linux" ]; then npm run build:linux; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
